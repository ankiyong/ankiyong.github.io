<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>생성형 AI와 친해지기 실습 프롬프트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* 강의안 PPT와 같은 톤: 코랄→보라 그라데이션 바탕 위 밝은 판, 하늘색(개념)·코랄(실습) 제목 띠, 흰 카드, 파랑·보라 강조.
   배치: 왼쪽 차시 목록, 오른쪽 실습 번호와 빈칸 채우기 활동지. 좁은 화면에서는 위에서 아래로. 한 가지 밝은 테마만 사용. */
:root {
  color-scheme: light;
  --grad-a: #FF5757;
  --grad-b: #8C52FF;
  --panel: #FAFAFA;
  --surface: #FFFFFF;
  --ink: #222222;
  --muted: #6B6B6B;
  --line: #D9D9D9;
  --blue: #4C61C3;
  --blue-soft: #EEF2FF;
  --band: #BAD3FF;
  --purple: #5E17EB;
  --coral: #FF5757;
  --coral-soft: #FFEEEE;
  --dark: #272729;
  --danger: #C62828;
  --shadow: 0 2px 5px rgba(34, 34, 34, .16);
  --font-display: "JASO Sans", "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}

* { box-sizing: border-box; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100%;
  background: linear-gradient(90deg, var(--grad-a), var(--grad-b));
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--purple); outline-offset: 2px; }

.wrap { width: calc(100% - 44px); max-width: 1160px; margin: 22px auto; padding: 26px 28px 44px; background: var(--panel); border-radius: 6px; box-shadow: 0 6px 24px rgba(34, 34, 34, .22); display: flex; flex-direction: column; gap: 20px; }

/* 머리말 */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 24px; }
.brand { margin: 0 0 6px; font-size: 13px; font-weight: 800; letter-spacing: .04em; color: var(--purple); }
.course { margin: 0 0 2px; font-size: 15px; font-weight: 700; color: var(--ink); }
h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(26px, 4.2vw, 38px); line-height: 1.2; color: var(--purple); text-wrap: balance; }
.how { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 8px; font-size: 14px; font-weight: 500; color: var(--muted); }
.how li { display: flex; align-items: center; gap: 6px; }
.how b { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--blue); color: #fff; font-size: 13px; font-weight: 700; }
.how li + li::before { content: "›"; margin-right: 2px; color: var(--line); font-weight: 700; }

.safe { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 18px; padding: 13px 18px; background: var(--dark); color: #fff; border-radius: 12px; box-shadow: var(--shadow); font-size: 14.5px; }
.safe p { margin: 0; }
.safe strong { margin-right: 6px; font-weight: 700; color: #A87BFF; }
.safe .sub { color: #DDDDDD; }
.reset { display: flex; align-items: center; gap: 8px; }
.ghost { padding: 7px 13px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--ink); }
.ghost:hover { border-color: var(--blue); color: var(--blue); }
.ghost.warn { background: var(--coral); border-color: var(--coral); color: var(--ink); font-weight: 700; }

/* 본문 2단 */
.layout { display: grid; grid-template-columns: 262px minmax(0, 1fr); gap: 24px; align-items: start; }
.chapters { display: flex; flex-direction: column; gap: 8px; position: sticky; top: 16px; }
.label { margin: 0 0 2px; font-size: 13px; font-weight: 700; color: var(--muted); }
.ch { display: grid; grid-template-columns: 62px 1fr; align-items: stretch; width: 100%; padding: 0; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); overflow: hidden; }
.ch .num { display: grid; place-items: center; padding: 10px 0; background: var(--blue-soft); color: var(--blue); font-weight: 700; font-size: 14.5px; white-space: nowrap; }
.ch .ttl { display: flex; align-items: center; padding: 9px 12px; font-size: 14.5px; font-weight: 600; line-height: 1.35; }
.ch:hover { border-color: var(--blue); }
.ch[aria-current="true"] { border-color: var(--purple); box-shadow: 0 0 0 1.5px var(--purple), var(--shadow); }
.ch[aria-current="true"] .num { background: var(--purple); color: #fff; }

.main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.chead { padding: 13px 18px 12px; background: var(--band); border-radius: 4px; text-align: center; }
.chead h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 23px; line-height: 1.3; text-wrap: balance; }
.chead p { margin: 2px 0 0; font-size: 14.5px; color: #3D4A6B; }

.files { display: flex; flex-direction: column; gap: 8px; padding: 13px 14px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.files[hidden] { display: none; }
.fhead { margin: 0 0 1px; font-size: 13.5px; font-weight: 700; color: var(--blue); }
.file { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 9px; background: var(--blue-soft); color: var(--ink); text-decoration: none; }
.file:hover { box-shadow: 0 0 0 1.5px var(--blue); }
.file .ext { min-width: 50px; padding: 2px 0; border-radius: 6px; background: var(--blue); color: #fff; font-size: 11.5px; font-weight: 800; text-align: center; letter-spacing: .02em; }
.file .ext.none { background: transparent; }
.file.noext { grid-template-columns: minmax(0, 1fr) auto; }
.file .fn { font-size: 15px; font-weight: 700; line-height: 1.4; }
.file .use { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }
.file .dl { font-size: 13.5px; font-weight: 700; color: var(--purple); white-space: nowrap; }
.practices { display: flex; flex-wrap: wrap; gap: 8px; }
.pr { display: flex; align-items: center; gap: 9px; padding: 8px 15px 8px 9px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); font-size: 15px; font-weight: 600; }
.pr:hover { border-color: var(--blue); }
.pr .no { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--blue); color: #fff; font-weight: 700; font-size: 14px; }
.pr[aria-current="true"] { border-color: var(--purple); box-shadow: 0 0 0 1.5px var(--purple), var(--shadow); }
.pr[aria-current="true"] .no { background: var(--purple); }

.cards { display: flex; flex-direction: column; gap: 16px; }
.pband { margin: 0; padding: 11px 18px 10px; background: var(--coral); border-radius: 4px; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 1.35; color: var(--ink); text-wrap: balance; }
.pnote, .empty { margin: 0; display: flex; align-items: flex-start; gap: 10px; font-size: 15.5px; font-weight: 600; }
.pill { flex: none; margin-top: 1px; padding: 1px 13px; border-radius: 999px; background: var(--coral); color: #fff; font-size: 13px; font-weight: 700; line-height: 1.7; text-shadow: 0 0 1px rgba(0,0,0,.35); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 12px; }
.card header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 14px; }
.card h4 { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.4; }
.where { margin: 0; font-size: 13.5px; font-weight: 600; color: var(--blue); }
.ref { margin: 0; padding: 10px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; font-size: 15.5px; }
.ref span { display: block; margin-bottom: 2px; font-size: 12.5px; font-weight: 700; color: var(--muted); }

.prompt { padding: 12px 16px; background: var(--blue-soft); border-radius: 12px; font-size: 17px; font-weight: 500; line-height: 2.25; }
.ln { min-height: 1em; }
.ln .n { font-variant-numeric: tabular-nums; }
.ln[data-dropped] { opacity: .5; }
.ln[data-dropped] .n { visibility: hidden; }

/* 빈칸: 숨은 글자(mirror)가 크기를 정하고 입력란이 그 위를 덮음 */
.blank { position: relative; display: inline-grid; vertical-align: baseline; max-width: 100%; min-width: 4.2em; line-height: 1.5; margin: 0 1px; }
.blank .mirror, .blank textarea { padding: 2px 9px 3px; font: inherit; font-weight: 600; line-height: inherit; white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-all; }
/* 입력란 아래 테두리 2px과 오른쪽 여유 6px만큼 mirror를 키워, 안내 글이 잘리거나 다음 줄로 넘어가 숨지 않게 한다 */
.blank .mirror { visibility: hidden; grid-area: 1 / 1; padding-right: 15px; padding-bottom: 5px; }
.blank textarea { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; resize: none; overflow: hidden; color: var(--purple); background: var(--surface); border: 0; border-bottom: 2px solid var(--purple); border-radius: 7px 7px 0 0; }
.blank[data-empty] textarea { border-bottom-color: var(--coral); }
.blank textarea::placeholder { color: var(--muted); font-weight: 400; font-size: 0.8em; line-height: 1.875; opacity: 1; }
.blank[data-invalid] textarea { background: var(--coral-soft); border-bottom-color: var(--danger); }
.blank.block { display: grid; min-height: 4.6em; margin: 0; }
.josa { color: var(--muted); }
.josa[data-set] { color: inherit; }

/* 단계형 카드 */
.stepper { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; font-size: 14px; font-weight: 700; }
.stepper li { padding: 3px 14px; border: 1.5px solid var(--line); border-radius: 999px; color: var(--muted); background: var(--surface); }
.stepper li[data-state="done"] { background: var(--blue-soft); border-color: var(--blue-soft); color: var(--blue); }
.stepper li[data-state="now"] { background: var(--purple); border-color: var(--purple); color: #fff; }
.stephint { margin: 0; font-size: 15.5px; }
.stephint b { font-weight: 700; color: var(--purple); }
.tag { display: inline; white-space: nowrap; margin-right: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 700; line-height: 1.7; vertical-align: 0.1em; background: var(--surface); color: var(--blue); user-select: none; }
.piece[data-new] .tag { background: var(--purple); color: #fff; }
.next { padding: 8px 16px; background: var(--surface); color: var(--purple); border: 2px solid var(--purple); border-radius: 9px; font-size: 15.5px; font-weight: 700; }
.next:hover { background: var(--blue-soft); }

.listctl { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 6px; line-height: 1.4; }
.mini { padding: 5px 13px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 999px; font-size: 14px; font-weight: 700; color: var(--blue); }
.mini:hover:not(:disabled) { border-color: var(--blue); }
.mini:disabled { opacity: .5; cursor: default; color: var(--muted); }

/* 비교표 카드 */
.tblwrap { overflow-x: auto; }
.cmp { width: 100%; border-collapse: separate; border-spacing: 0 6px; font-size: 15.5px; }
.cmp th, .cmp td { padding: 8px 10px; text-align: left; vertical-align: middle; }
.cmp thead th { font-size: 14px; font-weight: 700; color: var(--blue); background: var(--blue-soft); }
.cmp thead th:first-child { background: transparent; color: var(--muted); }
.cmp thead th + th { border-left: 6px solid var(--surface); }
.cmp tbody th { font-weight: 600; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { width: 40px; height: 36px; padding: 0; border: 0; background: var(--surface); font-size: 16px; font-weight: 700; color: var(--muted); }
.seg button + button { border-left: 1.5px solid var(--line); }
.seg button:hover { background: var(--blue-soft); }
.seg button[aria-pressed="true"] { background: var(--blue); color: #fff; }
.seg button:focus-visible { outline-offset: -3px; }
.cmp td[data-invalid] .seg { border-color: var(--danger); }
.cmp td[data-invalid] .seg button { background: var(--coral-soft); }
.cmpq { margin: 4px 0 -4px; font-size: 15px; font-weight: 700; }

.answer { order: 9; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 14px 18px 15px; background: var(--dark); color: #fff; border-radius: 12px; font-size: 16.5px; font-weight: 500; }
.answer[hidden] { display: none; }
.answer .pill { margin: 0 0 4px; background: var(--purple); text-shadow: none; }
.answer strong { font-size: 14.5px; font-weight: 700; color: #A87BFF; }

.cnote { margin: 0; font-size: 14px; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.copy { padding: 9px 22px; background: var(--blue); color: #fff; border: 0; border-radius: 9px; font-size: 16px; font-weight: 700; min-width: 92px; }
.copy:hover { background: #3F52AD; }
.copy[data-done] { background: var(--dark); }
.status { font-size: 14.5px; font-weight: 700; }
.status[data-kind="err"] { color: var(--danger); }
.status[data-kind="ok"] { color: var(--blue); }
.manual { width: 100%; min-height: 110px; padding: 10px 12px; font: inherit; font-size: 15px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }

@media (max-width: 860px) {
  .wrap { width: calc(100% - 20px); margin: 10px auto; padding: 18px 14px 36px; gap: 16px; }
  .layout { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .chapters { position: static; flex-direction: row; flex-wrap: wrap; gap: 6px; }
  .chapters .label { width: 100%; }
  .ch { width: auto; grid-template-columns: auto; }
  .ch .num { padding: 7px 13px; }
  .ch .ttl { display: none; }
  .how { gap: 6px 14px; }
  .how li + li::before { content: none; }
  .chead h2 { font-size: 20px; }
  .pband { font-size: 18px; }
  .card { padding: 16px 14px 14px; }
  .prompt { padding: 10px 12px; font-size: 16px; }
  .cmp { font-size: 14.5px; }
  .cmp th, .cmp td { padding: 7px 6px; }
  .cmp td { padding: 7px 2px; }
  .cmp thead th + th { border-left-width: 4px; }
  .seg button { width: 30px; height: 34px; font-size: 15px; }
}
@media (prefers-reduced-motion: no-preference) {
  .ch, .pr, .copy, .ghost, .next, .mini { transition: background-color .12s, border-color .12s, box-shadow .12s; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <p class="brand">EID PLATFORM</p>
      <p class="course">AID 입문과정 [ 생성형 AI와 친해지기 ]</p>
      <h1>실습 프롬프트</h1>
    </div>
    <ol class="how" aria-label="사용 순서">
      <li><b>1</b>차시 고르기</li>
      <li><b>2</b>실습 번호 고르기</li>
      <li><b>3</b>빈칸 채우고 복사</li>
    </ol>
  </header>

  <section class="safe" aria-label="입력 전 확인">
    <p><strong>입력 전 확인</strong> 실명·사건번호·내부 수치는 ○○로 바꿔 씁니다. <span class="sub">여기에 쓴 내용은 이 화면에만 있고, 새로 고치면 지워집니다.</span></p>
    <div class="reset" id="reset"></div>
  </section>

  <div class="layout">
    <nav class="chapters" id="chapters" aria-label="차시"></nav>
    <main class="main">
      <div class="chead">
        <h2 id="chTitle"></h2>
        <p id="chGoal"></p>
      </div>
      <section class="files" id="chFiles" aria-label="이 차시에서 쓰는 자료" hidden></section>
      <div class="practices" id="practices" role="group" aria-label="실습 번호"></div>
      <div class="cards" id="cards"></div>
    </main>
  </div>
</div>

<script id="logic">
/* 빈칸 정의: 키 → [빈칸 안내 글, 예시 값] */
var FIELDS = {
  ck1: ['개인정보', '실명 · 주민번호 · 연락처 · 주소'],

  steps: ['내 업무 단계', '자료 모으기 → 핵심 정리 → 양식 채우기 → 확인'],
  rp0: ['업무 이름', '○○ 예방 교육'],
  rp1: ['핵심 1', '○○ 예방 교육 2회, ○○복지관 어르신 대상'],
  rp2: ['핵심 2', '참석 ○○명'],
  rp3: ['핵심 3', '다음 주 ○○동 추가'],

  find: ['찾을 내용', '최근 보이스피싱 수법과 통계'],
  fa1: ['조건 1', '경찰청·금융감독원 등 공공기관 자료 위주'],
  fa2: ['조건 2', '수법 3가지, 통계 3개'],
  fa3: ['조건 3', '내용마다 출처(기관, 날짜) 표시'],
  topic: ['보고서 주제', '최근 보이스피싱 수법과 예방 대책'],
  dr1: ['분량', '1쪽'],
  dr2: ['조건', '첨부 양식 순서대로'],
  dr3: ['조건', '개조식, 짧은 문장'],
  dr4: ['조건', '확인 안 된 내용은 [확인 필요]로 표시'],
  sk1: ['스킬 이름', '자료 조사'],
  sk2: ['고칠 점', '출처를 끝에 모아 적도록'],

  skn1: ['자료 조사 스킬 이름', ''],
  skn2: ['hwpx 작성 스킬 이름', ''],

function parseTemplate(t) {
  var res = [];
  t.split('\n').forEach(function (raw) {
    var dm = /^#\* (\w+)$/.exec(raw);
    if (dm) {
      var cnt = listCount(dm[1]);
      for (var q = 1; q <= cnt; q++) res.push({ opt: LISTS[dm[1]].opt, num: true, list: dm[1], segs: [{ t: 'blank', key: dm[1] + '_' + q, block: false }] });
      res.push({ ctrl: dm[1], segs: [] });
      return;
    }
    var opt = false, num = false, s = raw;
    if (s.indexOf('?# ') === 0) { opt = true; num = true; s = s.slice(3); }
    else if (s.indexOf('# ') === 0) { num = true; s = s.slice(2); }
    else if (s.indexOf('? ') === 0) { opt = true; s = s.slice(2); }
    var segs = [], re = /\{\{(.*?)\}\}/g, i = 0, m, prev = null;
    while ((m = re.exec(s))) {
      if (m.index > i) segs.push({ t: 'text', v: s.slice(i, m.index) });
      var body = m[1];
      if (body.charAt(0) === '~') {
        var ab = body.slice(1).split('/');
        segs.push({ t: 'josa', a: ab[0], b: ab[1], prev: prev });
      } else {
        var kf = body.split('|');
        segs.push({ t: 'blank', key: kf[0], block: kf[1] === 'b' });
        prev = kf[0];
      }
      i = re.lastIndex;
    }
    if (i < s.length) segs.push({ t: 'text', v: s.slice(i) });
    res.push({ opt: opt, num: num, segs: segs });
  });
  return res;
}

/* 앞말의 받침에 맞는 조사 고르기. a: 받침 있을 때(을·은·으로), b: 없을 때(를·는·로) */
function josa(word, a, b) {
  var w = (word || '').replace(/[\s"'“”‘’)\]>.,!?~…·]+$/, '');
  if (!w) return a + '/' + b;
  var ch = w.charAt(w.length - 1), code = ch.charCodeAt(0), jong;
  if (code >= 0xAC00 && code <= 0xD7A3) jong = (code - 0xAC00) % 28;
  else if (ch >= '0' && ch <= '9') jong = [21, 8, 0, 16, 0, 0, 1, 8, 8, 0][+ch];
  else if (ch === '%') jong = 0;
  else return a + '(' + b + ')';
  if (jong === 0) return b;
  if (a === '으로' && jong === 8) return b;
  return a;
}

function val(S, k) { return (S[k] || '').trim(); }

function lineDropped(L, S) {
  if (!L.opt) return false;
  var blanks = L.segs.filter(function (g) { return g.t === 'blank'; });
  return blanks.length > 0 && blanks.every(function (g) { return !val(S, g.key); });
}

/* 완성된 글과 비어 있는 필수 빈칸 목록. raw=true면 빈칸을 밑줄로 둔 틀 */
/* 비교표 카드: 고른 표시를 글로 정리 */
function assembleCheck(card, S) {
  var out = ['두 결과 비교 (O / △ / X)'], missing = [];
  card.rows.forEach(function (row, i) {
    var cells = card.cols.map(function (col, j) {
      var k = card.id + '_' + i + '_' + j;
      if (!S[k]) missing.push(k);
      return col + ' ' + (S[k] || '');
    });
    out.push('- ' + row + ': ' + cells.join(' / '));
  });
  if (card.lineKey) {
    var line = val(S, card.lineKey);
    if (!line) missing.push(card.lineKey);
    out.push('한 줄 정리: ' + line);
  }
  return { text: out.join('\n'), missing: missing };
}

function assemble(lines, S, raw) {
  var out = [], missing = [], n = 0;
  lines.forEach(function (L) {
    if (L.ctrl) return;
    if (!raw && lineDropped(L, S)) return;
    var s = L.num ? (++n) + '. ' : '';
    L.segs.forEach(function (g) {
      if (g.t === 'text') {
        var v = g.v;
        if (v.charAt(0) === '.' && /[.?!]$/.test(s)) v = v.slice(1);
        s += v;
      } else if (g.t === 'blank') {
        if (raw) { s += '____________'; return; }
        var x = val(S, g.key);
        if (/@$/.test(s)) x = x.replace(/^@+\s*/, '');
        if (!x) missing.push(g.key);
        s += x;
      } else {
        s += raw ? g.a + '/' + g.b : josa(val(S, g.prev), g.a, g.b);
      }
    });
    out.push(s);
  });
  return { text: out.join('\n'), missing: missing };
}

function applyDerived(S, AUTO) {
  Object.keys(DERIVE).forEach(function (k) {
    var d = DERIVE[k];
    var v;
    if (d.copy) v = val(S, d.copy);
    else {
      var from = [];
      for (var i = 1; i <= listCount(d.list); i++) from.push(d.list + '_' + i);
      v = from.map(function (f) { return val(S, f); }).filter(Boolean).join(d.sep);
    }
    if (!val(S, k) || S[k] === AUTO[k]) { S[k] = v; AUTO[k] = v; }
  });
}

    });
    minus.addEventListener('click', function () {
      delete S[name + '_' + cnt]; N[name] = cnt - 1; renderCards();
    });
    box.appendChild(plus); box.appendChild(minus);
    return box;
  }

  /* 비교표 카드 */
  function buildCheckCard(card) {
    var art = el('article', { 'class': 'card' });
    var head = el('header');
    head.appendChild(el('h4', null, card.title));
    if (card.where) head.appendChild(el('p', { 'class': 'where' }, card.where));
    art.appendChild(head);

    var wrap = el('div', { 'class': 'tblwrap' });
    var table = el('table', { 'class': 'cmp' });
    var thead = el('thead'), hr = el('tr');
    hr.appendChild(el('th', { scope: 'col' }, '확인할 것'));
    card.cols.forEach(function (c) { hr.appendChild(el('th', { scope: 'col' }, c)); });
    thead.appendChild(hr); table.appendChild(thead);
    var tbody = el('tbody');
    card.rows.forEach(function (row, i) {
      var tr = el('tr');
      tr.appendChild(el('th', { scope: 'row' }, row));
      card.cols.forEach(function (col, j) {
        var key = card.id + '_' + i + '_' + j;
        var td = el('td', { 'data-cell': key });
        var seg = el('div', { 'class': 'seg', role: 'group', 'aria-label': col + ' · ' + row });
        ['O', '△', 'X'].forEach(function (mark) {
          var b = el('button', { type: 'button', 'aria-pressed': S[key] === mark ? 'true' : 'false' }, mark);
          b.addEventListener('click', function () {
            if (S[key] === mark) delete S[key]; else S[key] = mark;
            td.removeAttribute('data-invalid');
            clearErr(td);
            Array.prototype.forEach.call(seg.children, function (x) { x.setAttribute('aria-pressed', S[key] === x.textContent ? 'true' : 'false'); });
          });
          seg.appendChild(b);
        });
        td.appendChild(seg); tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody); wrap.appendChild(table); art.appendChild(wrap);

    if (card.lineKey) {
      art.appendChild(el('p', { 'class': 'cmpq' }, card.lineLabel));
      var pr = el('div', { 'class': 'prompt' });
      pr.appendChild(buildBlank(card, { key: card.lineKey, block: true }));
      art.appendChild(pr);
    }
    if (card.note) art.appendChild(el('p', { 'class': 'cnote' }, card.note));

    var act = el('div', { 'class': 'actions' });
    var copy = el('button', { type: 'button', 'class': 'copy' }, '복사');
    var status = el('span', { 'class': 'status', role: 'status' });
    copy.addEventListener('click', function () {
      var r = assembleCheck(card, S);
      if (r.missing.length) {
        Array.prototype.forEach.call(art.querySelectorAll('td[data-cell]'), function (td) {
          if (r.missing.indexOf(td.getAttribute('data-cell')) >= 0) td.setAttribute('data-invalid', '');
        });
        markMissing(art, r.missing, status, '아직 표시하지 않은 곳 ' + r.missing.length + '곳을 채우면 복사됩니다.');
        return;
      }
      sendCopy(art, r.text, copy, status, '복사했습니다. 붙여 넣으세요.');
    });
    act.appendChild(copy); act.appendChild(status);
    if (!card.noCopy) art.appendChild(act);
    return art;
  }

  function clearErr(node) {
    var st = node.closest('.card').querySelector('.status[data-kind="err"]');
    if (st) { st.textContent = ''; st.removeAttribute('data-kind'); }
  }

  function markMissing(art, missing, status, msg) {
    var first = null;
    Array.prototype.forEach.call(art.querySelectorAll('textarea[data-key]'), function (ta) {
      if (missing.indexOf(ta.getAttribute('data-key')) >= 0 && !ta.value.trim()) {
        ta.parentNode.setAttribute('data-invalid', '');
        if (!first) first = ta;
      }
    });
    status.setAttribute('data-kind', 'err');
    status.textContent = msg;
    if (first) first.focus();
  }

  function buildCard(card) {
    if (card.kind === 'steps') return buildStepCard(card);
    if (card.kind === 'check') return buildCheckCard(card);
    var lines = parseTemplate(card.t);
    var keys = [];
    lines.forEach(function (L) { L.segs.forEach(function (g) { if (g.t === 'blank' && keys.indexOf(g.key) < 0) keys.push(g.key); }); });
    var art = el('article', { 'class': 'card' });
    art._lines = lines;

    var head = el('header');
    head.appendChild(el('h4', null, card.title));
    if (card.where) head.appendChild(el('p', { 'class': 'where' }, card.where));
    art.appendChild(head);

    if (card.ref) {
      var ref = el('p', { 'class': 'ref' });
      ref.appendChild(el('span', null, '원래 문장'));
      ref.appendChild(document.createTextNode(card.ref));
      art.appendChild(ref);
    }

    var pr = el('div', { 'class': 'prompt' });
    lines.forEach(function (L) {
      if (L.ctrl) { pr.appendChild(buildCtrl(card, L.ctrl)); return; }
      var ln = el('div', { 'class': 'ln' });
      ln._line = L;
      if (L.num) ln.appendChild(el('span', { 'class': 'n' }));
      if (!L.segs.length) ln.appendChild(document.createElement('br'));
      L.segs.forEach(function (g) {
        if (g.t === 'text') ln.appendChild(document.createTextNode(g.v));
        else if (g.t === 'josa') { var j = el('span', { 'class': 'josa' }); j._g = g; ln.appendChild(j); }
        else ln.appendChild(buildBlank(card, g));
      });
      pr.appendChild(ln);
    });
    art.appendChild(pr);
    if (card.note) art.appendChild(el('p', { 'class': 'cnote' }, card.note));

    var act = el('div', { 'class': 'actions' });
    var status = el('span', { 'class': 'status', role: 'status' });
    if (card.answer) {
      /* 직접 써 본 뒤 정답을 펼쳐 보는 카드: 복사 없음 */
      var ansBox = el('div', { 'class': 'answer' });
      ansBox.appendChild(el('span', { 'class': 'pill' }, '정답 예시'));
      ansBox.appendChild(el('strong', null, card.answer.tip));
      ansBox.appendChild(el('span', null, card.answer.text));
      ansBox.hidden = !SHOWN[card.id];
      var ansBtn = el('button', { type: 'button', 'class': 'copy', 'aria-expanded': SHOWN[card.id] ? 'true' : 'false' }, SHOWN[card.id] ? '정답 숨기기' : '정답 확인');
      ansBtn.addEventListener('click', function () {
        if (!SHOWN[card.id]) {
          var r = assemble(lines, S, false);
          if (r.missing.length) { markMissing(art, r.missing, status, '먼저 직접 써 본 뒤 확인하세요.'); return; }
        }
        SHOWN[card.id] = !SHOWN[card.id];
        ansBox.hidden = !SHOWN[card.id];
        ansBtn.textContent = SHOWN[card.id] ? '정답 숨기기' : '정답 확인';
        ansBtn.setAttribute('aria-expanded', SHOWN[card.id] ? 'true' : 'false');
        status.textContent = ''; status.removeAttribute('data-kind');
      });
      art.appendChild(ansBox);
      act.appendChild(ansBtn);
    } else {
      var copy = el('button', { type: 'button', 'class': 'copy' }, '복사');
      copy.addEventListener('click', function () { doCopy(art, lines, copy, status, false); });
      act.appendChild(copy);
    }
    if (keys.some(function (k) { return fieldOf(k)[1]; })) {
      var ex = el('button', { type: 'button', 'class': 'ghost' }, '예시 넣기');
      ex.addEventListener('click', function () {
        keys.forEach(function (k) { if (!val(S, k) && fieldOf(k)[1]) S[k] = fieldOf(k)[1]; });
        renderCards();
      });
      act.appendChild(ex);
    }
    if (card.raw) {
      var rawBtn = el('button', { type: 'button', 'class': 'ghost' }, '빈 틀만 복사');
      rawBtn.addEventListener('click', function () { doCopy(art, lines, rawBtn, status, true); });
      act.appendChild(rawBtn);
    }
    act.appendChild(status);
    art.appendChild(act);
    return art;
  }

  function buildBlank(card, g) {
    var f = fieldOf(g.key);
    var wrap = el('span', { 'class': 'blank' + (g.block ? ' block' : '') });
    var mirror = el('span', { 'class': 'mirror', 'aria-hidden': 'true' });
    var ta = el('textarea', { id: 'f-' + card.id + '-' + g.key, rows: '1', 'data-key': g.key, 'aria-label': f[0], placeholder: f[0], spellcheck: 'false', autocomplete: 'off' });
    ta.value = S[g.key] || '';
    ta.addEventListener('input', function () {
      if (!g.block && /\n/.test(ta.value)) ta.value = ta.value.replace(/\s*\n\s*/g, ' ');
      S[g.key] = ta.value;
      wrap.removeAttribute('data-invalid');
      clearErr(ta);
      refreshAll(ta);
    });
    if (!g.block) ta.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' || e.isComposing) return;
      e.preventDefault();
      var art = ta.closest('.card');
      var all = Array.prototype.slice.call(art.querySelectorAll('textarea[data-key]'));
      var next = all[all.indexOf(ta) + 1];
      (next || art.querySelector('.copy')).focus();
    });
    wrap.appendChild(mirror); wrap.appendChild(ta);
    return wrap;
  }

  /* 화면의 모든 카드를 현재 값에 맞춤: 같은 키 동기화, 빈칸 크기, 번호, 조사, 빠지는 줄 */
  function refreshAll(active) {
    applyDerived(S, AUTO);
    Array.prototype.forEach.call(document.querySelectorAll('textarea[data-key]'), function (ta) {
      var v = S[ta.getAttribute('data-key')] || '';
      if (ta !== active && ta.value !== v) ta.value = v;
      var wrap = ta.parentNode;
      wrap.firstChild.textContent = (ta.value || ta.placeholder) + '​';
      if (ta.value.trim()) wrap.removeAttribute('data-empty'); else wrap.setAttribute('data-empty', '');
    });
    Array.prototype.forEach.call(document.querySelectorAll('.card'), function (art) {
      var n = 0;
      Array.prototype.forEach.call(art.querySelectorAll('.ln'), function (ln) {
        var L = ln._line, dropped = lineDropped(L, S);
        if (dropped) ln.setAttribute('data-dropped', ''); else ln.removeAttribute('data-dropped');
        if (L.num) ln.querySelector('.n').textContent = (dropped ? n + 1 : ++n) + '. ';
        Array.prototype.forEach.call(ln.querySelectorAll('.josa'), function (j) {
          var w = val(S, j._g.prev);
          j.textContent = josa(w, j._g.a, j._g.b);
          if (w) j.setAttribute('data-set', ''); else j.removeAttribute('data-set');
        });
      });
    });
  }

  function writeClipboard(text) {
    function fallback() {
      var ta = el('textarea'); ta.value = text;
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      ta.remove(); return ok;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return fallback(); });
    }
    return Promise.resolve(fallback());
  }

  function doCopy(art, lines, btn, status, raw) {
    var r = assemble(lines, S, raw);
    if (r.missing.length) { markMissing(art, r.missing, status, '빈칸 ' + r.missing.length + '곳을 채우면 복사됩니다.'); return; }
    sendCopy(art, r.text, btn, status, raw ? '빈 틀을 복사했습니다. 메모장에 붙여 넣으세요.' : '복사했습니다. 붙여 넣으세요.');
  }

  function sendCopy(art, text, btn, status, okMsg) {
    var old = art.querySelector('.manual'); if (old) old.remove();
    var r = { text: text };
    writeClipboard(r.text).then(function (ok) {
      if (ok) {
        var label = btn.textContent;
        status.setAttribute('data-kind', 'ok');
        status.textContent = okMsg;
        btn.setAttribute('data-done', ''); btn.textContent = '복사됨';
        setTimeout(function () { btn.removeAttribute('data-done'); btn.textContent = label; status.textContent = ''; }, 2200);
      } else {
        status.setAttribute('data-kind', 'err');
        status.textContent = '자동 복사가 막혀 있습니다. 아래 글을 직접 복사하세요.';
        var m = el('textarea', { 'class': 'manual', readonly: '', 'aria-label': '완성된 글' });
        m.value = r.text; art.appendChild(m); m.focus(); m.select();
      }
    });
  }

  function renderReset(asking) {
    var box = $('reset'); box.textContent = '';
    if (!asking) {
      var b = el('button', { type: 'button', 'class': 'ghost' }, '쓴 내용 모두 지우기');
      b.addEventListener('click', function () { renderReset(true); });
      box.appendChild(b); return;
    }
    var yes = el('button', { type: 'button', 'class': 'ghost warn' }, '모두 지우기');
    var no = el('button', { type: 'button', 'class': 'ghost' }, '취소');
    yes.addEventListener('click', function () { S = {}; AUTO = {}; STEP = {}; SHOWN = {}; N = {}; renderCards(); renderReset(false); });
    no.addEventListener('click', function () { renderReset(false); });
    box.appendChild(yes); box.appendChild(no); yes.focus();
  }

  function go(c, p) {
    cur = { c: c, p: p };
    renderChapters(); renderPractices(); renderCards();
    try { history.replaceState(null, '', '#c' + c + '-p' + p); } catch (e) {}
  }
  function fromHash() {
    var m = /^#c(\d)-p(\d)$/.exec(location.hash || '');
    var c = m ? +m[1] : 1, p = m ? +m[2] : 1;
    var ch = DATA.filter(function (x) { return x.n === c; })[0];
    if (!ch) { c = 1; p = 1; ch = DATA[0]; }
    if (!ch.practices.some(function (x) { return x.n === p; })) p = 1;
    cur = { c: c, p: p };
    renderChapters(); renderPractices(); renderCards();
  }

  renderReset(false);
  fromHash();
  window.addEventListener('hashchange', fromHash);
})();
</script>
</body>
</html>
